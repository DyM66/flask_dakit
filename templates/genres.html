{% extends 'base.html' %}

{% block title %}Dakit - Géneros{% endblock %}

{% block content %}
    <h1>Géneros</h1>

    <table class="table">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for genre in genres %}
            <tr>
                <td>{{ genre.name }}</td>
                <td>
                    <a href="{{ url_for('delete_genre', id=genre.id) }}" class="btn btn-sm btn-danger">Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <h2>Agregar nuevo género</h2>
    <form action="{{ url_for('genres') }}" method="POST">
        <div class="form-group">
            <label for="name">Nombre del género</label>
            <input type="text" name="name" id="name" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Agregar</button>
    </form>

    <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Volver al inicio</a>
{% endblock %}
