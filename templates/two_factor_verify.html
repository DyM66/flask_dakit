{% extends 'base.html' %}

{% block title %}Dakit - Verificación{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
            <h1 class="h3 mb-1 text-center">Revisa tu correo</h1>
            <p class="text-muted text-center small mb-4">Enviamos un código de 6 dígitos a <strong>{{ email }}</strong>. Ingrésalo para entrar (vence en 10 minutos).</p>
            <form action="{{ url_for('login_2fa') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <input type="text" name="code" class="form-control form-control-lg text-center" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="000000" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100">Verificar</button>
            </form>
            <form action="{{ url_for('login_2fa_resend') }}" method="POST" class="text-center mt-2">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn btn-link btn-sm">¿No te llegó? Reenviar código</button>
            </form>
            <a href="{{ url_for('login') }}" class="btn btn-link btn-sm w-100">Cancelar</a>
        </div>
    </div>
{% endblock %}
